server {
    listen 80;
    server_name _;

    # ${BACKEND_URL} is substituted at container start (nginx image envsubst).
    # Cloud Run: set BACKEND_URL to the backend service URL.
    # Compose: set BACKEND_URL=http://backend:8080.
    # nginx variables are escaped as $$var so envsubst leaves them alone.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $$host;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;
    }
    location /health { proxy_pass ${BACKEND_URL}; }
    location /ready { proxy_pass ${BACKEND_URL}; }
    location /docs { proxy_pass ${BACKEND_URL}; }
    location /openapi.json { proxy_pass ${BACKEND_URL}; }

    location / {
        root /usr/share/nginx/html;
        try_files $$uri $$uri/ /index.html;
    }
}
